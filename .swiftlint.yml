force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional:
  mode: all
  severity: error

cyclomatic_complexity:
  warning: 6
  error: 8

function_body_length:
  warning: 35
  error: 50

type_body_length:
  warning: 180
  error: 260

file_length:
  warning: 300
  error: 450
  ignore_comment_only_lines: true

closure_body_length:
  warning: 20
  error: 35

function_parameter_count:
  warning: 4
  error: 6

large_tuple:
  warning: 2
  error: 3

nesting:
  type_level:
    warning: 1
    error: 2
  function_level:
    warning: 2
    error: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - z
    - dx
    - dy
    - i
    - j

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 45
    error: 60

custom_rules:
  pitchai_no_try_optional:
    name: "PitchAI no silent try?"
    regex: "\\btry\\?\\b"
    message: "Do not use try? in business logic; handle or throw the error explicitly."
    severity: error

  pitchai_no_empty_catch:
    name: "PitchAI no empty catch"
    regex: "catch\\s*\\{\\s*\\}"
    message: "Empty catch blocks hide real failures."
    severity: error

  pitchai_no_task_detached:
    name: "PitchAI no Task.detached"
    regex: "\\bTask\\s*\\.\\s*detached\\b"
    message: "Task.detached is forbidden outside audited concurrency gateways."
    severity: error

  pitchai_no_unchecked_sendable:
    name: "PitchAI no unchecked Sendable"
    regex: "@unchecked\\s+Sendable"
    message: "@unchecked Sendable requires an audited exception."
    severity: error

  pitchai_no_assume_isolated:
    name: "PitchAI no MainActor.assumeIsolated"
    regex: "\\bMainActor\\s*\\.\\s*assumeIsolated\\b"
    message: "MainActor.assumeIsolated requires an audited UI boundary exception."
    severity: error

  pitchai_no_print_logging:
    name: "PitchAI no print logging"
    regex: "\\bprint\\s*\\("
    message: "Use the project logger instead of print."
    severity: error
