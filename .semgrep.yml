rules:
  - id: pitchai.swift.no-empty-catch
    languages: [swift]
    severity: ERROR
    message: Empty catch blocks hide real failures.
    patterns:
      - pattern: |
          catch {
          }

  - id: pitchai.swift.no-silent-try-optional
    languages: [swift]
    severity: ERROR
    message: Do not use try? in business logic; handle or throw the error explicitly.
    pattern-regex: '\btry\?(?!\w)'

  - id: pitchai.swift.no-force-try
    languages: [swift]
    severity: ERROR
    message: Force try is forbidden in runtime code.
    pattern-regex: '\btry!(?!\w)'

  - id: pitchai.swift.no-task-detached
    languages: [swift]
    severity: ERROR
    message: Task.detached is forbidden outside audited concurrency gateways.
    pattern: Task.detached { ... }

  - id: pitchai.swift.no-unchecked-sendable
    languages: [swift]
    severity: ERROR
    message: "@unchecked Sendable requires an audited exception."
    pattern-regex: '@unchecked\s+Sendable'

  - id: pitchai.swift.no-mainactor-assumeisolated
    languages: [swift]
    severity: ERROR
    message: MainActor.assumeIsolated requires an audited UI boundary exception.
    pattern: MainActor.assumeIsolated(...)

  - id: pitchai.swift.no-urlsession-outside-gateway
    languages: [swift]
    severity: ERROR
    message: Direct URLSession calls belong in approved API gateway/client modules.
    paths:
      exclude:
        - "**/API/**"
        - "**/Api/**"
        - "**/Client/**"
        - "**/Clients/**"
        - "**/Gateway/**"
        - "**/Gateways/**"
        - "**/Tests/**"
    pattern-either:
      - pattern: URLSession.shared.data(...)
      - pattern: URLSession.shared.dataTask(...)
      - pattern: URLSession.shared.upload(...)
      - pattern: URLSession.shared.download(...)

  - id: pitchai.swift.no-userdefaults-outside-persistence
    languages: [swift]
    severity: ERROR
    message: Direct UserDefaults access belongs in persistence/config gateways.
    paths:
      exclude:
        - "**/Persistence/**"
        - "**/Storage/**"
        - "**/Config/**"
        - "**/Settings/**"
        - "**/Tests/**"
    pattern: UserDefaults.standard

  - id: pitchai.swift.no-hardcoded-secret-key-name
    languages: [swift]
    severity: ERROR
    message: Secret-like names with literal values are forbidden.
    pattern-regex: '(?i)(api[_-]?key|secret|token)\s*[:=]\s*"[^"]{16,}"'

  - id: pitchai.swift.no-print-logging
    languages: [swift]
    severity: ERROR
    message: Use the project logger instead of print.
    paths:
      exclude:
        - "**/Tests/**"
        - "**/Preview*/**"
    pattern: print(...)

  - id: py-try-except-outside-edges
    message: "try/except is only allowed at explicit IO/API/UI/CLI edges; business logic should fail loudly."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          try:
            ...
          except ...:
            ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @click.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @typer.$CMD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @celery.task(...)
          def $F(...): ...
      - pattern-not-inside: |
          @shared_task(...)
          def $F(...): ...
      - pattern-not-inside: |
          if __name__ == "__main__":
            ...
    paths:
      include: ["**/*.py"]
      exclude:
        - "**/tests/**"
        - "**/.venv/**"
        - "**/venv/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/__pycache__/**"

  - id: forbid-requests-outside-infra
    message: "HTTP calls must go through an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: requests.$F(...)
          - pattern: httpx.$F(...)
          - pattern: aiohttp.$F(...)
          - pattern: urllib.request.$F(...)
          - pattern: urllib3.$F(...)
          - pattern: socket.$F(...)
    paths:
      exclude:
        - "**/tests/**"

  - id: forbid-aws-sdks-outside-infra
    message: "Cloud SDKs must be wrapped in an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: boto3.$F(...)
          - pattern: botocore.$F(...)
          - pattern: aiobotocore.$F(...)
    paths:
      exclude:
        - "**/tests/**"

  - id: no-handmade-paths
    message: "Build keys and paths through a naming abstraction in application/interface code."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: Path($X) / $Y
          - pattern: $P.mkdir(..., parents=$Z, ...)
          - pattern: os.path.join($X, $Y, ...)
          - pattern: f".../{...}/..."
          - pattern: $A + "/" + $B
          - pattern: '"/" + $X'
    paths:
      include:
        - "**/app/application/**"
        - "**/app/interfaces/**"
        - "**/src/*/application/**"
        - "**/src/*/interfaces/**"
      exclude:
        - "**/app/naming/**"
        - "**/src/*/naming/**"
        - "**/tests/**"
